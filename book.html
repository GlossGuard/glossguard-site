<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now – GlossGuard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="booking-page">

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a class="book-now-btn" href="book.html">Book Now</a></li>
        </ul>
    </nav>

    <section class="booking-header">
        <h1>Book Your Detailing Appointment</h1>
        <p>Premium mobile detailing across Gloucestershire & Herefordshire.</p>
    </section>

    <section class="booking-form-container">
        <form id="bookingForm" class="booking-form">

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" required>

            <label>Vehicle Type</label>
            <select name="vehicle" required>
                <option value="">Select</option>
                <option>Hatchback</option>
                <option>SUV</option>
                <option>Estate</option>
                <option>Luxury / Performance</option>
            </select>

            <label>Service</label>
            <select name="service" required>
                <option value="">Select</option>
                <option>Mini Valet</option>
                <option>Full Valet</option>
                <option>Interior Deep Clean</option>
                <option>Exterior Deep Clean</option>
            </select>

            <label>Preferred Date</label>
            <input type="date" name="date" required>

            <label>Additional Notes</label>
            <textarea name="notes" rows="4"></textarea>

            <button type="submit" class="submit-btn">Confirm Booking</button>
        </form>
    </section>

<script>
    const dateInput = document.querySelector('input[type="date"]');

    const bankHolidays = [
        "2026-01-01",
        "2026-04-03",
        "2026-04-06",
        "2026-05-04",
        "2026-05-25",
        "2026-08-31",
        "2026-12-25",
        "2026-12-28"
    ];

    dateInput.addEventListener('input', function () {
        const selected = this.value;
        const date = new Date(selected);
        const day = date.getDay(); // 0 = Sun, 6 = Sat

        const isWeekend = (day === 0 || day === 6);
        const isBankHoliday = bankHolidays.includes(selected);

        if (!isWeekend && !isBankHoliday) {
            alert("Weekdays are fully booked. Please select a weekend or bank holiday.");
            this.value = "";
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {

    emailjs.init("d7Mnq2jQH9Rw0VDrx");

    const form = document.getElementById("bookingForm");

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        emailjs.send("service_agfqrgg", "template_mdcx348", {
            name: form.querySelector('input[name="name"]').value,
            email: form.querySelector('input[name="email"]').value,
            phone: form.querySelector('input[name="phone"]').value,
            vehicle: form.querySelector('select[name="vehicle"]').value,
            service: form.querySelector('select[name="service"]').value,
            date: form.querySelector('input[name="date"]').value,
            notes: form.querySelector('textarea[name="notes"]').value
        })
        .then(() => {
            alert("Booking request sent successfully! We will contact you shortly to confirm the booking");
            form.reset();
        }, (error) => {
            alert("Failed to send booking. Please try again.");
            console.error(error);
        });
    });

});
</script>


</body>
</html>
