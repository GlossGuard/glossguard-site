<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now – GlossGuard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="booking-page">

    <section class="booking-header">
        <h1>Book Your Detailing Appointment</h1>
        <p>Premium mobile detailing across Gloucestershire & Herefordshire.</p>
    </section>

    <section class="booking-form-container">
        <form class="booking-form">

            <label>Name</label>
            <input type="text" required>

            <label>Email</label>
            <input type="email" required>

            <label>Phone Number</label>
            <input type="tel" required>

            <label>Vehicle Type</label>
            <select required>
                <option value="">Select</option>
                <option>Hatchback</option>
                <option>SUV</option>
                <option>Estate</option>
                <option>Luxury / Performance</option>
            </select>

            <label>Service</label>
            <select required>
                <option value="">Select</option>
                <option>Exterior Detail</option>
                <option>Interior Deep Clean</option>
                <option>Full Detail</option>
                <option>Maintenance Wash</option>
            </select>

            <label>Preferred Date</label>
            <input type="date" required>

            <label>Additional Notes</label>
            <textarea rows="4"></textarea>

            <button type="submit" class="submit-btn">Confirm Booking</button>
        </form>
    </section>

</body>
</html>
